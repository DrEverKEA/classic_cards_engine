name: C++ Engine Matrix Build

on: [push, pull_request]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install IWYU (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y iwyu

    - name: Install IWYU (macOS)
      if: runner.os == 'macOS'
      run: brew install include-what-you-use

    - name: Configure CMake
      run: cmake -B build

    - name: Build Project
      run: cmake --build build