name: Update README with New Features
on:
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 

      - name: Extract Feature Commits and Update README
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          
          # Match either "FEAT:" or "FEATURE:"
          if [[ "$COMMIT_MSG" =~ ^(FEAT|FEATURE):[[:space:]]*(.*) ]]; then
            FEATURE_TEXT="${BASH_REMATCH[2]}"
            DATE=$(date +'%Y-%m-%d')
            
            # Ensure README ends with a newline before appending
            [ -n "$(tail -c1 README.md)" ] && echo "" >> README.md
            echo "* **[$DATE]** $FEATURE_TEXT" >> README.md
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: Auto-update README with new feature"
            git push
          else
            echo "No new features to append."
          fi